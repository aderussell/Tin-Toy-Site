<!DOCTYPE html>
<html lang="en-GB">

  <head>
    <meta charset="utf-8">
        
    <meta name="keywords" content="adrian, russell, iOS, Mac, OS X, software, programming, objective-c, swift, uk, bristol">
        
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{% if page.title %}Tin Toy - {{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="initial-scale=1, viewport-fit=cover">
    <meta name="description" content="{{ site.description }}">
    <meta name="apple-itunes-app" content="app-id=6737349612">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <link rel="icon" type="image/png" href="/images/tintoy/tin-toy-icon-light.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <script>hljs.highlightAll();</script>


    <!-- Custom CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{{ "/stylesheets/tintoy.css" | prepend: site.baseurl }}">

    <meta name="theme-color" content="#222222" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

    <script src="/_tintoy/animated-logo.js"></script>
    {% if page.js %}
     <script src="{{ page.js }}"></script>
    {% endif %}

  {% if page.css %}
     <link rel="stylesheet" href="{{ page.css }}">
    {% endif %}

    {% include google_analytics.html %}

</head>

    <body>

    <div class="tintoy-site-nav">
      <ul>
        <li><a href="/" class="title-nav">
          <picture>
            <source srcset="/images/tintoy/tin-toy-icon-light.png" media="(prefers-color-scheme: light)"/>
            <img src="/images/tintoy/tin-toy-icon.png" height="24" alt="" role="presentation"/>
        </picture>
          <span class="title-nav-title">Tin Toy</span>
        </a></li>
        <li style="margin-left: auto;""><a href="/support" class="other-nav">Getting started</a></li>
        <li><a href="/examples" class="other-nav">Examples</a></li>
      </ul>
    </div>

	<div class="container">
      {{ content }}
	</div>
	
<footer>
  © 2025 <a href="https://adrianrussell.co.uk">Adrian Russell</a>. All rights reserved.
</footer>

    </body>
</html>
